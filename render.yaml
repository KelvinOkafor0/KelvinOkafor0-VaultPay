services:
  - type: web
    name: vaultpay-api
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./full-stack/infra/railway/Dockerfile.api
    dockerContext: ./full-stack
    healthCheckPath: /api/v1/health
    preDeployCommand: /app/scripts/migrate.sh
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: vaultpay-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TTL
        value: 15m
      - key: REFRESH_TTL
        value: 30d
      - key: KYC_PROVIDER
        value: flutterwave
      - key: BANK_PROVIDER
        value: flutterwave
      - key: CARD_PROVIDER
        value: mock
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: FLW_BASE_URL
        value: https://api.flutterwave.com
      - key: FLW_SECRET_KEY
        sync: false
      - key: FLW_SECRET_HASH
        sync: false
      - key: FLW_KYC_REDIRECT_URL
        sync: false

  - type: worker
    name: vaultpay-worker
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./full-stack/infra/railway/Dockerfile.worker
    dockerContext: ./full-stack
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vaultpay-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        fromService:
          type: web
          name: vaultpay-api
          envVarKey: JWT_ACCESS_SECRET
      - key: JWT_REFRESH_SECRET
        fromService:
          type: web
          name: vaultpay-api
          envVarKey: JWT_REFRESH_SECRET
      - key: ACCESS_TTL
        value: 15m
      - key: REFRESH_TTL
        value: 30d
      - key: KYC_PROVIDER
        value: flutterwave
      - key: BANK_PROVIDER
        value: flutterwave
      - key: CARD_PROVIDER
        value: mock
      - key: WEBHOOK_SECRET
        fromService:
          type: web
          name: vaultpay-api
          envVarKey: WEBHOOK_SECRET
      - key: FLW_BASE_URL
        value: https://api.flutterwave.com
      - key: FLW_SECRET_KEY
        fromService:
          type: web
          name: vaultpay-api
          envVarKey: FLW_SECRET_KEY
      - key: FLW_SECRET_HASH
        fromService:
          type: web
          name: vaultpay-api
          envVarKey: FLW_SECRET_HASH
      - key: FLW_KYC_REDIRECT_URL
        fromService:
          type: web
          name: vaultpay-api
          envVarKey: FLW_KYC_REDIRECT_URL

  - type: web
    name: vaultpay-web
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./full-stack/infra/railway/Dockerfile.web
    dockerContext: ./full-stack
    healthCheckPath: /health
    envVars:
      - key: API_INTERNAL_URL
        fromService:
          type: web
          name: vaultpay-api
          property: hostport

databases:
  - name: vaultpay-db
    plan: basic-256mb
    region: frankfurt
